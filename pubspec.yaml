name: enso
description: "Asanova — yoga, breathwork and meditation."
publish_to: 'none'

version: 1.0.0+3

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  go_router: ^18.1.0
  provider: ^6.1.5+1
  shared_preferences: ^2.5.6
  flutter_tts: ^4.2.5
  audioplayers: ^6.8.1
  flutter_local_notifications: ^22.3.2
  timezone: ^0.11.2
  flutter_timezone: ^5.1.1
  wakelock_plus: ^1.8.1
  lucide_icons_flutter: ^4.0.0
  intl: ^0.20.2
  video_player: ^2.14.1
  url_launcher: ^6.3.3
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.2
  http: ^1.6.0
  path_provider: ^2.1.5
  purchases_flutter: ^9.9.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/data/i18n/
    - assets/images/
    - assets/audio/
    - assets/video/
    - assets/voice/

  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-Italic.ttf
          style: italic

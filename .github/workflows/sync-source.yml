name: Sync source snapshot

# Applies a source snapshot (uploaded by scripts/store/push-repo.py as a draft-release
# asset) onto main as a normal commit, then removes the temporary release. Workflow files are
# left alone: they are written through the contents API because GITHUB_TOKEN cannot change them.

on:
  workflow_dispatch:
    inputs:
      release_id:
        description: "Draft release id holding source.tar.gz"
        required: true
      message:
        description: "Commit message"
        required: true

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Download snapshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ASSET=$(gh api repos/${{ github.repository }}/releases/${{ inputs.release_id }} --jq '.assets[] | select(.name=="source.tar.gz") | .id')
          test -n "$ASSET"
          curl -sSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" \
            "https://api.github.com/repos/${{ github.repository }}/releases/assets/$ASSET" -o "$RUNNER_TEMP/source.tar.gz"
          mkdir -p "$RUNNER_TEMP/src" && tar -xzf "$RUNNER_TEMP/source.tar.gz" -C "$RUNNER_TEMP/src"
          rsync -a --delete --exclude='.git' --exclude='.github' "$RUNNER_TEMP/src/" ./
      - name: Commit
        env:
          MSG: ${{ inputs.message }}
        run: |
          git config user.name "Asanova build"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -q -m "$MSG"
          git push origin HEAD:main
      - name: Remove temporary release
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE repos/${{ github.repository }}/releases/${{ inputs.release_id }} || true
